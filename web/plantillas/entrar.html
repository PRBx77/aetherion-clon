{% extends "base.html" %}
{% block titulo %}Entrar · Aetherion Diseño{% endblock %}
{% block nav %}<a href="{{ url_for('registro') }}">Tengo una invitación</a>{% endblock %}
{% block cuerpo %}
<form class="tarjeta formulario" method="post">
  <h2>Entrar</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <label>Nombre de usuario <input name="nombre" required autocomplete="username"></label>
  <label>Contraseña <input type="password" name="clave" required autocomplete="current-password"></label>
  <button class="boton">Entrar</button>
</form>
{% endblock %}
